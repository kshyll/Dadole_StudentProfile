<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Contact information for Trishya Dadole">
    <title>Contact | Trishya Dadole</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">

        <header class="top-banner">
            <div class="top-banner-inner"></div>
        </header>

        <main id="main" class="page-content">

            <section class="page-title-card">
                <p class="eyebrow">CONTACT</p>
                <h1>Let's Connect</h1>
                <p>You can reach me through my platforms or send a message below.</p>
            </section>

            <section class="contact-list">

                <a class="contact-card" href="mailto:trishyasmdadole@gmail.com">
                    <div class="contact-icon">@</div>

                    <div class="contact-copy">
                        <span class="contact-label">Email</span>
                        <strong>trishyasmdadole@gmail.com</strong>
                    </div>
                </a>

                <a class="contact-card" href="https://github.com/kshyll" target="_blank" rel="noopener noreferrer">
                    <div class="contact-icon">GH</div>

                    <div class="contact-copy">
                        <span class="contact-label">GitHub</span>
                        <strong>github.com/kshyll</strong>
                    </div>
                </a>

                <a class="contact-card" href="https://instagram.com/trishyadadole" target="_blank"
                    rel="noopener noreferrer">
                    <div class="contact-icon">IG</div>

                    <div class="contact-copy">
                        <span class="contact-label">Social Media</span>
                        <strong>@trishyadadole</strong>
                    </div>
                </a>

            </section>

            <section class="contact-form-card">

                <div class="section-heading">
                    <p class="eyebrow">MESSAGE</p>
                    <h2>Send Me a Message</h2>
                </div>

                <form class="contact-form">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your email">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="Message subject">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message..."></textarea>
                    </div>

                    <button type="button" class="primary-button">
                        Send Message
                    </button>

                </form>

            </section>

        </main>

        <nav class="bottom-nav" aria-label="Main navigation">

            <a href="index.html" class="nav-item">
                Profile
            </a>

            <a href="about.html" class="nav-item">
                About
            </a>

            <a href="skills.html" class="nav-item">
                Skills
            </a>

            <a href="projects.html" class="nav-item">
                Projects
            </a>

            <a href="contact.html" class="nav-item active" aria-current="page">
                Contact
            </a>

        </nav>

    </div>

</body>

</html>
